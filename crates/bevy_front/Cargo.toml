[package]
name = "temporal-chess-bevy"
version = "0.1.0"
edition = "2024"

[dependencies]
temporal-chess-engine = { path = "../engine" }
bevy = { version = "0.19.0", default-features = false, features = ["std", "async_executor", "bevy_asset", "bevy_log", "bevy_winit", "bevy_render", "bevy_core_pipeline", "bevy_camera", "bevy_color", "keyboard", "mouse"] }
bevy_egui = { version = "0.42.0", default-features = false, features = ["render", "default_fonts", "manage_clipboard"] }
resvg = { version = "0.45.1", default-features = false }

temporal-chess-protocol = { path = "../protocol" }
ewebsock = { version = "0.8.0", features = ["tls"] }
serde_json = "1"
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sha2 = "0.10"
bevy = { version = "0.19.0", default-features = false, features = ["multi_threaded", "x11", "wayland"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.19.0", default-features = false, features = ["web", "webgl2"] }
web-sys = { version = "0.3", features = ["Window", "Location", "Storage", "Document", "Element", "HtmlElement", "CssStyleDeclaration"] }
