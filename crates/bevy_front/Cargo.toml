[package]
name = "nolan-chess-bevy"
version = "0.1.0"
edition = "2024"

[dependencies]
nolan_chess = { path = "../engine" }
bevy = { version = "0.19.0", default-features = false, features = ["std", "async_executor", "bevy_asset", "bevy_log", "bevy_winit", "bevy_render", "bevy_core_pipeline", "bevy_camera", "bevy_color", "multi_threaded", "keyboard", "mouse", "x11", "wayland"] }
bevy_egui = { version = "0.42.0", default-features = false, features = ["render", "default_fonts", "manage_clipboard"] }
resvg = { version = "0.45.1", default-features = false }
